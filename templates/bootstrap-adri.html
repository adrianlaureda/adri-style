<!doctype html>
<!--
  bootstrap-adri.html · v5.8 (2026-07-18)
  Starter para páginas web generales. Otras superficies pueden usar un starter
  propio, pero siempre declaran data-preset y respetan el contrato.

  Cómo cambiar de preset:
    1. Sustituir el bloque "Fonts (Bold Signal)" por las <link> del preset elegido
       (ver references/style-presets.md sección del preset).
    2. Sustituir el contenido completo del :root y [data-theme="*"] por las CSS
       variables del preset elegido. NO mezclar tokens de presets distintos.
    3. Actualizar el comentario `preset:` y el atributo data-preset del <html>.

  Reglas operativas (post-audit Codex 2026-05-08):
    - Pasa audit-adri.sh sin issues críticos antes de publicar.
    - Body weights respetan el rango declarado por el preset (Bold Signal: 300/400/500).
    - NO subir font-weight a 600+ por defecto sin justificarlo en el preset.
    - Animar solo transform y opacity. Evitar animar propiedades de layout
      (anchos, altos, paddings, margins) — provocan layout thrash.
    - Evitar cubic-bezier con valores fuera de [0,1] en transitions normales (overshoot).
    - Iconos UI siempre Lucide SVG inline. NUNCA emojis para iconos.
-->
<!-- preset: 01-bold-signal -->
<html lang="es" data-theme="light" data-preset="01-bold-signal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Output adri-style — Bold Signal</title>

  <!-- Fonts (Bold Signal) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* ========================================================================
       Reset minimal
       ======================================================================== */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    img, svg { display: block; max-width: 100%; height: auto; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 0.18em; }

    /* ========================================================================
       Tokens del preset · Bold Signal ★ (light por defecto)
       Si cambias de preset, sustituye este bloque completo por el del preset
       elegido en references/style-presets.md.
       ======================================================================== */
    :root {
      /* Fuentes */
      --font-display: 'Satoshi', system-ui, -apple-system, sans-serif;
      --font-body:    'Inter', system-ui, -apple-system, sans-serif;
      --font-mono:    'JetBrains Mono', 'SF Mono', Menlo, monospace;

      /* Line heights */
      --lh-display: 1.05;
      --lh-body:    1.55;

      /* Backgrounds */
      --bg:          #f8f8f8;
      --bg-surface:  #ffffff;
      --bg-elevated: #efefef;

      /* Borders */
      --border: hsl(0 0% 0% / 0.10);

      /* Text */
      --text:           #0a0a0a;
      --text-secondary: hsl(0 0% 0% / 0.60);
      --text-muted:     hsl(0 0% 0% / 0.35);

      /* Accent (negro como acento neutro por defecto) */
      --accent:         #0a0a0a;
      --accent-surface: hsl(0 0% 0% / 0.06);

      /* Semánticos (verde/amarillo/rojo educativos) */
      --success: #16a34a;
      --warning: #ca8a04;
      --danger:  #dc2626;
      --info:    #2563eb;

      /* Geometría */
      --radius:      0px;
      --radius-pill: 999px;
      --maxw:        1200px;

      /* Movimiento (200ms default; sin overshoot por defecto) */
      --transition:      200ms;
      --transition-slow: 400ms;
      --ease-out:        cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out:     cubic-bezier(0.65, 0, 0.35, 1);

      /* Escala tipográfica fluida (Utopia · ratio 1.25) */
      --step--2: clamp(0.64rem, 0.59rem + 0.24vw, 0.80rem);
      --step--1: clamp(0.80rem, 0.74rem + 0.30vw, 1.00rem);
      --step-0:  clamp(1.00rem, 0.93rem + 0.37vw, 1.25rem);
      --step-1:  clamp(1.25rem, 1.16rem + 0.47vw, 1.56rem);
      --step-2:  clamp(1.56rem, 1.44rem + 0.61vw, 1.95rem);
      --step-3:  clamp(1.95rem, 1.79rem + 0.82vw, 2.44rem);
      --step-4:  clamp(2.44rem, 2.22rem + 1.10vw, 3.05rem);
      --step-5:  clamp(3.05rem, 2.76rem + 1.46vw, 3.81rem);

      /* Espaciado fluido */
      --space-3xs: clamp(0.25rem, 0.23rem + 0.12vw, 0.31rem);
      --space-2xs: clamp(0.50rem, 0.46rem + 0.19vw, 0.63rem);
      --space-xs:  clamp(0.75rem, 0.70rem + 0.25vw, 0.94rem);
      --space-s:   clamp(1.00rem, 0.93rem + 0.37vw, 1.25rem);
      --space-m:   clamp(1.50rem, 1.39rem + 0.56vw, 1.88rem);
      --space-l:   clamp(2.00rem, 1.85rem + 0.74vw, 2.50rem);
      --space-xl:  clamp(3.00rem, 2.78rem + 1.11vw, 3.75rem);
      --space-2xl: clamp(4.00rem, 3.70rem + 1.48vw, 5.00rem);
    }

    [data-theme="dark"] {
      --bg:             #050505;
      --bg-surface:     #0e0e0e;
      --bg-elevated:    #161616;
      --border:         hsl(0 0% 100% / 0.10);
      --text:           #ffffff;
      --text-secondary: hsl(0 0% 100% / 0.70);
      --text-muted:     hsl(0 0% 100% / 0.40);
      --accent:         #ffffff;
      --accent-surface: hsl(0 0% 100% / 0.06);
      --success:        #22c55e;
      --warning:        #eab308;
      --danger:         #f87171;
      --info:           #60a5fa;
    }

    /* Acentos opcionales por dominio (Bold Signal · 6 paletas).
       Uso: <body class="accent-azul"> (o el que aplique). */
    .accent-azul    { --accent: #3b82f6; --accent-surface: hsl(217 91% 60% / 0.10); }
    .accent-violeta { --accent: #a78bfa; --accent-surface: hsl(258 90% 76% / 0.12); }
    .accent-verde   { --accent: #22c55e; --accent-surface: hsl(142 71% 45% / 0.10); }
    .accent-naranja { --accent: #f97316; --accent-surface: hsl(24 95% 53% / 0.10);  }
    .accent-cyan    { --accent: #06b6d4; --accent-surface: hsl(189 94% 43% / 0.10); }
    .accent-rosa    { --accent: #f43f5e; --accent-surface: hsl(349 89% 60% / 0.10); }

    /* ========================================================================
       Base body (Bold Signal: body 300, NO 400)
       ======================================================================== */
    body {
      font-family: var(--font-body);
      font-size: var(--step-0);
      font-weight: 300;
      line-height: var(--lh-body);
      color: var(--text);
      background: var(--bg);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ========================================================================
       Utilidades tipográficas oficiales Bold Signal
       ======================================================================== */
    .t-overline {
      font-family: var(--font-display); font-weight: 500;
      font-size: 0.7rem; letter-spacing: 0.25em; text-transform: uppercase;
      color: var(--text-muted);
    }
    .t-section {
      font-family: var(--font-display); font-weight: 900;
      font-size: 0.85rem; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--text-secondary);
    }
    .t-display {
      font-family: var(--font-display); font-weight: 900;
      font-size: clamp(2.5rem, 6vw, 5rem); line-height: 0.95;
      letter-spacing: -0.03em;
    }
    .t-h2 {
      font-family: var(--font-display); font-weight: 900;
      font-size: clamp(1.5rem, 3vw, 2.25rem); line-height: 1.1;
      letter-spacing: -0.02em;
    }
    .t-mono {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-variant-numeric: tabular-nums;
    }

    /* ========================================================================
       Layout esqueleto (header · main · footer)
       ======================================================================== */
    .shell {
      width: 100%;
      max-width: var(--maxw);
      margin-inline: auto;
      padding-inline: var(--space-m);
    }

    .site-header {
      padding-block: var(--space-m);
      border-bottom: 1px solid var(--border);
    }
    .site-header__inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-s);
    }
    .site-header__brand {
      font-family: var(--font-display);
      font-weight: 900;
      letter-spacing: -0.02em;
      font-size: var(--step-1);
    }

    .site-main {
      flex: 1;
      padding-block: var(--space-xl);
      display: flex;
      flex-direction: column;
      gap: var(--space-xl);
    }

    .site-footer {
      padding-block: var(--space-m);
      border-top: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: var(--step--1);
    }

    /* ========================================================================
       Toggle de tema (lucide:moon / lucide:sun)
       ======================================================================== */
    .theme-toggle {
      width: 2.25rem;
      height: 2.25rem;
      display: inline-grid;
      place-items: center;
      color: var(--text-secondary);
      border: 1px solid var(--border);
      background: var(--bg-surface);
      transition: color var(--transition) var(--ease-out),
                  border-color var(--transition) var(--ease-out),
                  transform var(--transition) var(--ease-out);
    }
    .theme-toggle:hover {
      color: var(--text);
      border-color: var(--text);
    }
    .theme-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .theme-toggle .icon-moon { display: block; }
    .theme-toggle .icon-sun  { display: none; }
    [data-theme="dark"] .theme-toggle .icon-moon { display: none; }
    [data-theme="dark"] .theme-toggle .icon-sun  { display: block; }

    /* ========================================================================
       Hero placeholder (sustituir por contenido real)
       ======================================================================== */
    .hero {
      display: grid;
      gap: var(--space-m);
    }
    .hero h1 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: var(--step-5);
      line-height: var(--lh-display);
      letter-spacing: -0.03em;
      color: var(--text);
    }
    .hero p {
      margin: 0;
      max-width: 65ch;
      color: var(--text-secondary);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0ms !important;
        transition-duration: 0ms !important;
      }
    }
  </style>
</head>
<body>
  <!--
    Esqueleto neutro. Insertar contenido específico del output dentro de
    <main class="site-main">. Mantener el toggle de tema y la <header> (o
    eliminarlos si el output no los necesita: presentación pantalla completa).
  -->

  <header class="site-header">
    <div class="shell site-header__inner">
      <span class="site-header__brand">Output adri-style</span>
      <button
        type="button"
        class="theme-toggle"
        aria-label="Activar modo oscuro"
        data-action="toggle-theme">
        <!-- lucide:moon -->
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
        <!-- lucide:sun -->
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2"/>
          <path d="M12 20v2"/>
          <path d="m4.93 4.93 1.41 1.41"/>
          <path d="m17.66 17.66 1.41 1.41"/>
          <path d="M2 12h2"/>
          <path d="M20 12h2"/>
          <path d="m6.34 17.66-1.41 1.41"/>
          <path d="m19.07 4.93-1.41 1.41"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="site-main">
    <!--
      Punto de extensión principal. Sustituir el .hero por el contenido real
      del output (slides, dashboard cards, lección, etc.). Mantener el grid
      y el max-width 65ch en prose.
    -->
    <section class="shell hero">
      <span class="t-overline">preset · bold signal ★</span>
      <h1>Bootstrap canónico adri-style</h1>
      <p>Cualquier output nuevo nace de este archivo. Sustituye este hero por el contenido real, mantén los tokens del preset elegido y verifica con <code class="t-mono">audit-adri.sh</code> antes de publicar.</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="shell">
      <span class="t-mono">adri-style v5.8 · bootstrap</span>
    </div>
  </footer>

  <script>
    // Toggle de tema persistente en localStorage (clave 'adri-theme').
    (function () {
      var KEY = 'adri-theme';
      var root = document.documentElement;
      var stored = null;
      try { stored = localStorage.getItem(KEY); } catch (_) { /* sandbox */ }
      if (stored === 'dark' || stored === 'light') {
        root.setAttribute('data-theme', stored);
      }
      function syncToggleLabel() {
        var trigger = document.querySelector('[data-action="toggle-theme"]');
        if (!trigger) return;
        var dark = root.getAttribute('data-theme') === 'dark';
        trigger.setAttribute(
          'aria-label',
          dark ? 'Activar modo claro' : 'Activar modo oscuro'
        );
      }
      syncToggleLabel();
      document.addEventListener('click', function (ev) {
        var trigger = ev.target.closest('[data-action="toggle-theme"]');
        if (!trigger) return;
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        syncToggleLabel();
        try { localStorage.setItem(KEY, next); } catch (_) { /* sandbox */ }
      });
    })();
  </script>
</body>
</html>
