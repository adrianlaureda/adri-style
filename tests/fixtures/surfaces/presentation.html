<!doctype html>
<html lang="es" data-preset="01-bold-signal" data-surface="presentation" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PRO-211 · Presentación</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#f8f8f8;font:300 16px/1.5 Inter,sans-serif;overflow:hidden}
    .slide-stage{width:100vw;height:100dvh;display:grid;grid-template-columns:1fr 32ch;align-items:center;gap:8vw;padding:7vw}
    h1{font:900 clamp(60px,10vw,150px)/.82 Satoshi,sans-serif;letter-spacing:-.075em;margin:0;max-width:7ch}
    p{font-size:clamp(16px,1.5vw,24px);color:#aaa}.slide-count{position:fixed;right:3vw;bottom:3vw;font-size:12px;letter-spacing:.12em}
    @media(max-width:760px){.slide-stage{grid-template-columns:1fr;align-content:center}.slide-stage aside{max-width:34ch}}
  </style>
</head>
<body>
  <main class="slide-stage">
    <h1>Identidad no es plantilla.</h1>
    <aside><p>Console opera. La Galería respira. El dashboard compara. La presentación amplifica una idea.</p><small>PRO-211 · contrato transversal</small></aside>
  </main>
  <span class="slide-count">01 / 04</span>
</body>
</html>
