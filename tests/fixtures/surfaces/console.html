<!doctype html>
<html lang="es" data-preset="01-bold-signal" data-surface="console" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PRO-211 · Console</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f5f3;color:#111;font:400 14px/1.5 Inter,sans-serif}
    .console-shell{display:grid;grid-template-columns:220px 1fr;min-height:100dvh}
    nav{padding:24px;border-right:1px solid #d8d8d4;background:#ecece9}
    nav b,h1{font-family:Satoshi,sans-serif}nav b{display:block;font-size:18px;margin-bottom:32px}
    nav a{display:block;padding:8px 0;color:#555;text-decoration:none}
    main{padding:32px}.bar{display:flex;justify-content:space-between;border-bottom:1px solid #d8d8d4;padding-bottom:20px}
    h1{margin:0;font-size:28px;letter-spacing:-.04em}.status{font:500 12px Inter,sans-serif}
    .log{display:grid;grid-template-columns:80px 1fr auto;gap:20px;padding:15px 0;border-bottom:1px solid #ddd}
    .pass{font-weight:500}@media(max-width:640px){.console-shell{grid-template-columns:1fr}nav{display:none}}
  </style>
</head>
<body>
  <div class="console-shell">
    <nav><b>Adri Console</b><a href="#">Overview</a><a href="#">Audits</a><a href="#">Systems</a></nav>
    <main>
      <header class="bar"><div><h1>Auditoría PRO-211</h1><span>18 jul 2026</span></div><span class="status">4 superficies</span></header>
      <div class="log"><time>09:42</time><b>27 presets contractuales</b><span class="pass">PASS</span></div>
      <div class="log"><time>09:43</time><b>Gramáticas de superficie</b><span class="pass">PASS</span></div>
      <div class="log"><time>09:44</time><b>Reglas decorativas universales</b><span class="pass">0</span></div>
    </main>
  </div>
</body>
</html>
